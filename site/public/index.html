<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Doctor</title>
<style>
  :root{
    --ink:#0a0b0e; --ink-2:#12141a; --ink-3:#181b23;
    --gold:#e3b341; --green:#3fd968; --red:#ff6b6b; --paper:#e6e9ef;
    --dim:#8a92a6; --edge:rgba(255,255,255,.09);
    --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--gold)}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}

  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding-bottom:18px;border-bottom:1px solid var(--edge);margin-bottom:26px}
  h1{margin:0;font-size:26px;letter-spacing:-.02em}
  h1 span{color:var(--gold)}
  .built{color:var(--dim);font-size:13px;margin-left:auto}

  .tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));
    margin-bottom:24px}
  .tile{background:var(--ink-2);border:1px solid var(--edge);border-radius:12px;
    padding:14px 16px;box-shadow:var(--sh)}
  .tile b{display:block;font-size:27px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
  .tile small{color:var(--dim);font-size:12.5px}
  .tile.hot b{color:var(--gold)} .tile.dead b{color:var(--red)}

  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .chip{background:var(--ink-2);border:1px solid var(--edge);color:var(--paper);
    border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;
    font-family:inherit;transition:.15s}
  .chip:hover{border-color:var(--gold)}
  .chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);
    color:#1a1405;font-weight:600}
  .chip i{font-style:normal;opacity:.6;margin-left:5px}
  input[type=search]{flex:1;min-width:180px;background:var(--ink-2);color:var(--paper);
    border:1px solid var(--edge);border-radius:999px;padding:8px 16px;
    font:inherit;font-size:13.5px}
  input[type=search]:focus{outline:none;border-color:var(--gold)}

  .row{background:var(--ink-2);border:1px solid var(--edge);border-radius:12px;
    margin-bottom:9px;overflow:hidden;box-shadow:var(--sh)}
  .head{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;
    padding:13px 16px;cursor:pointer}
  .head:hover{background:var(--ink-3)}
  .need{font-size:19px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
  .n-hi{color:var(--red)} .n-mid{color:var(--gold)} .n-lo{color:var(--dim)}
  .nm{font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12.5px;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .tag{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap;
    border:1px solid var(--edge);color:var(--dim)}
  .tag.bad{color:var(--red);border-color:rgba(255,107,107,.3)}
  .tag.ok{color:var(--green);border-color:rgba(63,217,104,.3)}
  .tag.rule{color:var(--gold);border-color:rgba(227,179,65,.3)}

  .body{display:none;padding:4px 16px 18px;border-top:1px solid var(--edge)}
  .row.open .body{display:block}
  .prob{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .prob:last-child{border-bottom:none}
  .prob b{font-weight:600}
  .prob em{font-style:normal;color:var(--dim);font-size:12.5px;display:block;margin-top:2px}
  .sev{font-size:10.5px;padding:2px 7px;border-radius:999px;margin-right:7px;
    border:1px solid var(--edge);color:var(--dim)}
  .sev.high{color:var(--red);border-color:rgba(255,107,107,.3)}

  .quote{background:var(--ink-3);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;
    padding:11px 14px;margin:12px 0 0;font-size:14px}
  .quote small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:5px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
  .btn{background:transparent;border:1px solid var(--edge);color:var(--paper);
    border-radius:8px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;
    text-decoration:none;display:inline-block;transition:.15s}
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn.on{border-color:var(--green);color:var(--green)}

  .empty{color:var(--dim);text-align:center;padding:50px 20px}
  .evals{margin-top:40px;border-top:1px solid var(--edge);padding-top:24px}
  .evals h2{font-size:17px;margin:0 0 6px}
  .evals p{color:var(--dim);font-size:13.5px;margin:0 0 14px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--edge);
    font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:500;font-size:12px}
  @media(max-width:600px){
    .head{grid-template-columns:40px 1fr;gap:10px}
    .tags{grid-column:1/-1;justify-content:flex-start;margin-top:2px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Site<span>Doctor</span></h1>
    <span class="built" id="built"></span>
  </header>

  <div class="tiles" id="tiles"></div>
  <div class="bar" id="bar"></div>
  <div id="list"></div>
  <div class="evals" id="evals" hidden></div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  // Именно textContent: названия и заголовки собраны с чужих сайтов,
  // вставлять их как разметку нельзя.
  if (text !== undefined) n.textContent = text;
  return n;
};

let DATA = { rows: [], evals: [] };
let filter = "all";
let query = "";

const FILTERS = [
  { id: "all",    label: "Все" },
  { id: "hot",    label: "Писать в первую очередь", test: r => r.write && r.need >= 60 },
  { id: "dead",   label: "Сайт лежит",              test: r => r.state === "dead" || r.error },
  { id: "mobile", label: "Не под телефон",          test: r => r.viewport === false },
  { id: "menu",   label: "Меню файлом PDF",          test: r => r.menuFlat },
  { id: "nocall", label: "Некуда написать",         test: r => r.form === false },
  { id: "heavy",  label: "Тяжёлые фото",            test: r => r.heavyKb > 1024 },
  { id: "fine",   label: "Всё в порядке",           test: r => r.write === false && !r.error },
  { id: "todo",   label: "Без вердикта",            test: r => r.need === null },
];

const match = (r) => {
  const f = FILTERS.find(f => f.id === filter);
  if (f?.test && !f.test(r)) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  return r.name.toLowerCase().includes(q) || (r.url || "").toLowerCase().includes(q)
      || (r.ru || "").toLowerCase().includes(q);
};

const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u || ""; } };
const needClass = (n) => n >= 70 ? "n-hi" : n >= 40 ? "n-mid" : "n-lo";

function tiles() {
  const R = DATA.rows;
  const box = $("#tiles");
  box.replaceChildren();
  const add = (n, label, cls) => {
    const t = el("div", "tile" + (cls ? " " + cls : ""));
    t.append(el("b", null, String(n)), el("small", null, label));
    box.append(t);
  };
  add(R.length, "сайтов проверено");
  add(R.filter(r => r.write && r.need >= 60).length, "писать в первую очередь", "hot");
  add(R.filter(r => r.state === "dead" || r.error).length, "лежат или исчезли", "dead");
  add(R.filter(r => r.menuFlat).length, "меню файлом PDF");
  add(R.filter(r => r.viewport === false).length, "не под телефон");
  add(R.filter(r => r.need === null).length, "ждут вердикта");
}

function bar() {
  const box = $("#bar");
  box.replaceChildren();
  for (const f of FILTERS) {
    const n = f.test ? DATA.rows.filter(f.test).length : DATA.rows.length;
    if (f.test && n === 0) continue;
    const b = el("button", "chip", f.label);
    b.append(el("i", null, String(n)));
    b.setAttribute("aria-pressed", String(filter === f.id));
    b.onclick = () => { filter = f.id; bar(); list(); };
    box.append(b);
  }
  const s = el("input");
  s.type = "search"; s.placeholder = "Поиск по названию или адресу"; s.value = query;
  s.oninput = () => { query = s.value; list(); };
  box.append(s);
}

function card(r) {
  const row = el("div", "row");
  const head = el("div", "head");

  const need = el("div", "need " + (r.need === null ? "n-lo" : needClass(r.need)),
                  r.need === null ? "—" : String(r.need));
  const mid = el("div");
  mid.append(el("div", "nm", r.name + (r.town ? ", " + r.town : "")));
  mid.append(el("div", "sub", r.ru || r.error || host(r.url)));

  const tags = el("div", "tags");
  const tag = (t, cls) => tags.append(el("span", "tag" + (cls ? " " + cls : ""), t));
  if (r.error) tag(r.blocked ? "закрыт от ботов" : "не открылся", "bad");
  if (r.state === "dead") tag("мёртвый", "bad");
  if (r.viewport === false) tag("не адаптив", "bad");
  if (r.menuFlat) tag("меню файлом PDF", "bad");
  if (r.form === false) tag("нет связи", "bad");
  if (r.heavyKb > 1024) tag(Math.round(r.heavyKb / 1024 * 10) / 10 + " МБ фото", "bad");
  if (r.https === false) tag("без https", "bad");
  if (r.platform) tag(r.platform);
  if (r.write === false && !r.error) tag("не трогать", "ok");
  if (r.judged === "правилом") tag("без модели", "rule");
  if (r.conf === "low") tag("низкая уверенность");

  head.append(need, mid, tags);
  head.onclick = () => row.classList.toggle("open");

  const body = el("div", "body");
  if (r.problems?.length) {
    for (const p of r.problems) {
      const d = el("div", "prob");
      const s = el("span", "sev " + (p.severity || ""),
                   p.severity === "high" ? "важно" : p.severity === "medium" ? "средне" : "мелочь");
      d.append(s, el("b", null, p.what), el("em", null, p.evidence));
      body.append(d);
    }
  } else if (!r.error) {
    body.append(el("div", "prob", r.need === null
      ? "Вердикта пока нет. Запусти node judge.mjs"
      : "Модель проблем не нашла."));
  }

  if (r.it) {
    const q = el("div", "quote");
    q.append(el("small", null, "фраза для письма"), document.createTextNode(r.it));
    body.append(q);
  }

  const acts = el("div", "acts");
  if (r.url && !r.error) {
    const a = el("a", "btn", "Открыть сайт");
    a.href = r.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    acts.append(a);
  }
  if (r.it) {
    const c = el("button", "btn", "Скопировать фразу");
    c.onclick = async (e) => {
      e.stopPropagation();
      try {
        await navigator.clipboard.writeText(r.it);
        c.textContent = "Скопировано"; c.classList.add("on");
        setTimeout(() => { c.textContent = "Скопировать фразу"; c.classList.remove("on"); }, 1600);
      } catch { c.textContent = "Не вышло, скопируй руками"; }
    };
    acts.append(c);
  }
  if (acts.children.length) body.append(acts);

  row.append(head, body);
  return row;
}

function list() {
  const box = $("#list");
  box.replaceChildren();
  const rows = DATA.rows.filter(match);
  if (!rows.length) { box.append(el("div", "empty", "Ничего не нашлось")); return; }
  for (const r of rows) box.append(card(r));
}

function evals() {
  if (!DATA.evals?.length) return;
  const box = $("#evals");
  box.hidden = false;
  box.replaceChildren();
  box.append(el("h2", null, "Замеры качества"));
  box.append(el("p", null,
    "Каждая строка это прогон eval.mjs. Смотреть надо на F1 и на число ложных " +
    "срабатываний: они должны идти в разные стороны."));
  const t = el("table");
  const thead = el("tr");
  for (const h of ["Когда", "Сайтов", "Ошибка", "Точность", "Полнота", "F1", "Ложных", "Что менял"])
    thead.append(el("th", null, h));
  t.append(thead);
  for (const e of [...DATA.evals].reverse()) {
    const tr = el("tr");
    const d = new Date(e.at);
    for (const v of [
      d.toLocaleDateString("ru") + " " + d.toLocaleTimeString("ru", { hour: "2-digit", minute: "2-digit" }),
      e.n, e.mae, Math.round((e.prec ?? 0) * 100) + "%", Math.round((e.rec ?? 0) * 100) + "%",
      e.f1, e.fp, e.note || "",
    ]) tr.append(el("td", null, String(v)));
    t.append(tr);
  }
  box.append(t);
}

// Один и тот же файл работает в двух местах: отдельным Worker'ом,
// где данные лежат рядом, и внутри yaroslavyuzvak.info, где они
// приходят из /api/doctor за паролем. Адрес задаёт тот, кто встроил.
fetch(window.DATA_URL || "data.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .then(d => {
    DATA = d;
    const b = new Date(d.builtAt);
    $("#built").textContent = "собрано " + b.toLocaleDateString("ru") + " в " +
      b.toLocaleTimeString("ru", { hour: "2-digit", minute: "2-digit" });
    tiles(); bar(); list(); evals();
  })
  .catch(() => {
    $("#list").append(el("div", "empty",
      "Данные не загрузились. Собери их: node build-site.mjs"));
  });
</script>
</body>
</html>
